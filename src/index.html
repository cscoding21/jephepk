<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

    <!-- Primary SEO -->
    <title>Jeff Kody | Official EPK – Bio, Music, Press & Booking</title>
    <meta
      name="description"
      content="Official Electronic Press Kit for [Artist Name]. Download high-res photos, bio, discography, press quotes, streaming links, and booking contacts. [Genre] artist from [City/Country]."
    />
    <meta
      name="keywords"
      content="Jeff Kody, Jeff Kody EPK, Jeff Kody press kit, Heavy Metal musician, Heavy Metal artist, Thrash Metal guitarist, Hardcore guitarist, booking Jeff Kody, Las Vegas musician"
    />
    <meta name="author" content="Jeff Kody" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://jeph.me" />

    <!-- Open Graph / Facebook / LinkedIn / most social platforms -->
    <meta property="og:type" content="profile" />
    <!-- or "website" / "music.musician" if preferred -->
    <meta property="og:url" content="https://jeph.me" />
    <meta
      property="og:title"
      content="Jeff Kody – Official Electronic Press Kit"
    />
    <meta
      property="og:description"
      content="Bio, high-resolution photos, discography, press coverage, streaming stats, and booking information for Jeff Kody."
    />
    <meta
      property="og:image"
      content="https://www.yourdomain.com/images/epk-og-image.jpg"
    />
    <!--TODO -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Jeff Kody promotional photo for EPK"
    />
    <meta property="og:site_name" content="Jeff Kody Official" />
    <meta property="og:locale" content="en_US" />
    <!-- Optional but useful for music -->
    <meta property="music:musician" content="https://jeph.me" />
    <meta property="profile:username" content="Jeff Kody" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jeff Kody – Official EPK" />
    <meta
      name="twitter:description"
      content="Official press kit: bio, photos, music, press quotes & booking for Jeff Kody."
    />
    <meta
      name="twitter:image"
      content="https://www.yourdomain.com/images/epk-twitter-card.jpg"
    />
    <!--TODO -->
    <meta name="twitter:image:alt" content="Jeff Kody EPK promotional image" />

    <!-- Additional useful tags -->
    <meta name="theme-color" content="#000000" />
    <!-- brand color -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />

    <link
      rel="icon"
      type="image/png"
      href="https://jeph.me/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="https://jeph.me/favicon.svg" />
    <link rel="shortcut icon" href="https://jeph.me/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://jeph.me/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Jeff Kody" />
    <link rel="manifest" href="https://jeph.me/site.webmanifest" />

    <!-- Optional: Structured Data (JSON-LD) – highly recommended for SEO -->

        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "Jeff Kody",
        "url": "https://jeph.me",
